name: FlowTrader — Sync Journal to Dashboard

# DISABLED 2026-05-07: this workflow conflicts with the local
# trading-bot/scripts/push_journal.py, which is the canonical writer
# to journal/trades.jsonl on origin/main. When both ran, origin
# diverged from local and pushes failed silently — freezing the
# Streamlit dashboard's P&L charts on stale data. push_journal.py
# now owns the sync; this workflow is kept (manual trigger only)
# as an emergency fallback if the local task scheduler stops.
on:
  workflow_dispatch:           # Manual trigger only — no schedule

jobs:
  sync:
    name: Pull latest journal from trading-bot
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout this dashboard repo ────────────────────────────────────
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      # ── 2. Download the latest journal artifact from qlategan-stack/flowtrader
      - name: Download latest journal artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.FLOWTRADER_BOT_TOKEN }}
          repo: qlategan-stack/flowtrader
          workflow: trading-bot.yml
          workflow_conclusion: success
          name_is_regexp: true
          name: trading-journal-.*
          path: journal/
          if_no_artifact_found: warn

      # ── 3. Flatten artifact subdirectory if present ──────────────────────
      # dawidd6 places files in journal/<artifact-name>/ — copy them up one
      # level with -f so any existing dashboard-side file gets overwritten.
      # cp + rm is more reliable than mv across edge cases; we also log what
      # happens so future failures don't disappear into /dev/null.
      - name: Flatten artifact directory
        run: |
          shopt -s nullglob
          echo "── Before flatten ──"
          ls -la journal/ || true
          for subdir in journal/trading-journal-*/; do
            echo "── Flattening $subdir ──"
            ls -la "$subdir" || true
            for f in "$subdir"*; do
              name=$(basename "$f")
              cp -fv "$f" "journal/$name"
            done
            rm -rf "$subdir"
          done
          echo "── After flatten ──"
          ls -la journal/ || true

      # ── 4. Commit updated journal files if anything changed ───────────────
      # Add each tracked file individually so a missing file (e.g. no
      # weekly_summary.md yet) doesn't abort the whole git add and leave
      # nothing staged.
      - name: Commit and push journal updates
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          for f in \
            journal/trades.jsonl \
            journal/bot.log \
            journal/weekly_summary.md \
            journal/weekly_research_memo.md \
            journal/weekly_research_memo.json \
            journal/bybit_balance.json; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "Staged: $f"
            else
              echo "Skipped (not present): $f"
            fi
          done
          echo "── Staged changes ──"
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "No journal changes to commit"
          else
            git commit -m "chore: sync journal $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
